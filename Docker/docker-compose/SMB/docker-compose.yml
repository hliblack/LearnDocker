version: '3.3'
services:
  samba:
    image: dperson/samba
    container_name: dperson-samba
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - 139:139
      - 445:445
    volumes:
      - /share/hliblack:/mount
    # 账号密码移至 .env 文件（参考 .env.example，.env 已加入 .gitignore）
    command: '-u "${SMB_USER};${SMB_PASSWORD}" -s "share;/mount/;yes;yes;yes;all;none" -s "public;/mount/;yes;no;no;all;none"'
